    <section class="seccio-registre">
      <h1>REGISTRA'T</h1>
      <div id="contacteregistre">
        <div class="formulariregistre">
          <form
            action="mailto:info@infernofest.com"
            method="post"
            enctype="text/plain">
            <div class="campos">
              <input type="text" id="nom" name="nom" placeholder="Nom:"required />
            </div>
            <div class="campos">
              <input type="email" id="email" name="email" placeholder="Email:" required />
            </div>
            <div class="campos">
              <input
                type="password"
                id="contrasenya"
                name="contrasenya"
                required
                placeholder="Contrasenya:"
                minlength="8"
                pattern="^(?=.[a-z])(?=.[A-Z])(?=.\d)[a-zA-Z\d@$!%?&]{8,}$"
                title="Al menos 8 caracteres, una mayúscula, una minúscula y un número" />
            </div>
            <div>
              <button class="botoenviar" type="registre">Registrar-me</button>
            </div>
          </form>
        </div>
      </div>
    </section>
